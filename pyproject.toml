[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psf-learning"
version = "0.1.0"
description = "Persistence-State Framework for distinguishing stop-out from attrition in self-paced learning"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "[First Name] Wang", email = "your.email@example.com" }
]
keywords = [
    "learning analytics",
    "student persistence",
    "stop-out",
    "attrition",
    "hidden Markov model",
    "self-paced learning",
    "distance education",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "pandas>=1.4",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "matplotlib>=3.5",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.23",
]

[project.urls]
Homepage = "https://github.com/your-org/psf"
Documentation = "https://your-org.github.io/psf/"
Repository = "https://github.com/your-org/psf"
Issues = "https://github.com/your-org/psf/issues"
Changelog = "https://github.com/your-org/psf/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["psf*"]

[tool.setuptools.package-data]
psf = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=psf --cov-report=term-missing"

[tool.coverage.run]
source = ["psf"]
omit = ["tests/*", "examples/*"]